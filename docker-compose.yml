services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-polymarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polymarket}
      POSTGRES_DB: ${POSTGRES_DB:-polymarket}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  hardhat:
    image: node:22-bookworm-slim
    restart: unless-stopped
    working_dir: /workspace/apps/blockchain
    volumes:
      - .:/workspace
      - hardhat_node_modules:/workspace/apps/blockchain/node_modules
    ports:
      - "${HARDHAT_PORT:-8545}:8545"
    command: ["sh", "docker-entrypoint.sh"]

volumes:
  postgres_data:
  hardhat_node_modules:
