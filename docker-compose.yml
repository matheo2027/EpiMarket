name: epimarket

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-epimarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-epimarket}
      POSTGRES_DB: ${POSTGRES_DB:-epimarket}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  hardhat:
    image: node:22-bookworm-slim
    restart: unless-stopped
    working_dir: /workspace/apps/blockchain
    volumes:
      - .:/workspace
      - hardhat_node_modules:/workspace/apps/blockchain/node_modules
    ports:
      - "${HARDHAT_PORT:-8545}:8545"
    command: ["sh", "docker-entrypoint.sh"]

  discord-bot:
    image: node:22-bookworm-slim
    restart: unless-stopped
    working_dir: /workspace/apps/discord-bot
    volumes:
      - .:/workspace
      - discord_bot_node_modules:/workspace/apps/discord-bot/node_modules
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID}
      API_BASE_URL: ${DISCORD_BOT_API_BASE_URL:-http://host.docker.internal:4000}
      INTERNAL_API_SECRET_MODERATION: ${INTERNAL_API_SECRET_MODERATION}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["sh", "docker-entrypoint.sh"]

  bets-bot:
    image: node:22-bookworm-slim
    restart: unless-stopped
    working_dir: /workspace/apps/discord-bot
    volumes:
      - .:/workspace
      - bets_bot_node_modules:/workspace/apps/discord-bot/node_modules
    environment:
      BETS_DISCORD_BOT_TOKEN: ${BETS_DISCORD_BOT_TOKEN}
      BETS_DISCORD_CHANNEL_ID: ${BETS_DISCORD_CHANNEL_ID}
      API_BASE_URL: ${DISCORD_BOT_API_BASE_URL:-http://host.docker.internal:4000}
      INTERNAL_API_SECRET_BETS: ${INTERNAL_API_SECRET_BETS}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["sh", "docker-entrypoint.sh", "dev:bets"]

  resolutions-bot:
    image: node:22-bookworm-slim
    restart: unless-stopped
    working_dir: /workspace/apps/discord-bot
    volumes:
      - .:/workspace
      - resolutions_bot_node_modules:/workspace/apps/discord-bot/node_modules
    environment:
      RESOLUTIONS_DISCORD_BOT_TOKEN: ${RESOLUTIONS_DISCORD_BOT_TOKEN}
      RESOLUTIONS_DISCORD_CHANNEL_ID: ${RESOLUTIONS_DISCORD_CHANNEL_ID}
      API_BASE_URL: ${DISCORD_BOT_API_BASE_URL:-http://host.docker.internal:4000}
      INTERNAL_API_SECRET_RESOLUTIONS: ${INTERNAL_API_SECRET_RESOLUTIONS}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["sh", "docker-entrypoint.sh", "dev:resolutions"]

volumes:
  postgres_data:
  hardhat_node_modules:
  discord_bot_node_modules:
  bets_bot_node_modules:
  resolutions_bot_node_modules:
